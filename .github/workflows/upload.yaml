name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Install immutable dependencies
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
      - name: Check canonical Calcit and types
        run: |
          set -euo pipefail
          test -f calcit.cirru
          test -f deps.cirru
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit edit format
          if ! git diff --quiet --exit-code -- calcit.cirru; then
            echo "::error::Snapshot is not canonical; format it with the matching Calcit version."
            exit 1
          fi
          calcit --check-only --all-defs --format json
          calcit fix --workflow strict --verify --format json | jq -e '{workflow:.data.workflow,diagnostics:.diagnostics} | ., (.workflow.status == "passed" and .diagnostics == [])'
          calcit test app.comp.container/calculate-mirrored --require-match
          calcit --check-only --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.updater --summary-only --format json
      - name: Select frontend CDN path
        id: asset-path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          asset_prefix="${GITHUB_REPOSITORY}/"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          fi
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=https://cos-sh.tiye.me/${asset_prefix}" >> "$GITHUB_OUTPUT"
      - name: Build frontend
        env:
          VITE_BASE_URL: ${{ github.event_name == 'pull_request' && './' || steps.asset-path.outputs.base-url }}
        run: yarn build
      - name: Save PR frontend preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: poincare-disc-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Check current production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi
      - name: Upload and verify frontend
        if: steps.production.outputs.current == 'true'
        timeout-minutes: 10
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Deploy to server
        id: deploy
        if: steps.production.outputs.current == 'true'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
      - name: Display server deployment status
        if: steps.production.outputs.current == 'true'
        run: echo "${{ steps.deploy.outputs.status }}"
